spring.application.name=SentinelX Core API

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinelx
spring.datasource.username=sentinelx_app
spring.datasource.password=${SENTINELX_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=never

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# Application Logging
logging.level.com.sentinelx.core=INFO

# Spring Security Debugging
logging.level.org.springframework.security=TRACE