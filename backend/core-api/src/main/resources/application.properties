spring.application.name=SentinelX Core API

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinelx}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sentinelx_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SENTINELX_DB_PASSWORD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=never

# Server
server.port=8080

# ML Service Configuration
sentinelx.ml.base-url=${SENTINELX_ML_BASE_URL:http://127.0.0.1:8000}

# Collector API Authentication
sentinelx.collector.api-key=${SENTINELX_COLLECTOR_API_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info

# Application Logging
logging.level.com.sentinelx.core=INFO

# Spring Security Debugging
logging.level.org.springframework.security=INFO

# JWT Authentication
security.jwt.expiration-ms=900000
sentinelx.jwt.secret=${SENTINELX_JWT_SECRET}
sentinelx.jwt.expiration-seconds=3600
